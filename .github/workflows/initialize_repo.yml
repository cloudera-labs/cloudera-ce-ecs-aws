name: Initialize Repository from Template

# This workflow triggers on the first push to a new repository created from this template
# It will replace placeholders in documentation and workflow files with actual values
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  initialize:
    name: Initialize repository with actual values

    # We will only run this action when this repository isn't the
    # template repository
    #
    if: >-
      ${{ !github.event.repository.is_template }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Check if already initialized
        id: check_initialized
        run: |
          # Check if any placeholders still exist in the repository
          if grep -rq '<YOUR_REPO_NAME>' . --include="*.md" --include="*.yml" --include="*.yaml" \
            --exclude-dir=.git --exclude=initialize_repo.yml 2>/dev/null; then
            echo "needs_init=true" >> $GITHUB_OUTPUT
          else
            echo "needs_init=false" >> $GITHUB_OUTPUT
          fi

      - name: Replace placeholders in files
        if: steps.check_initialized.outputs.needs_init == 'true'
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME_ONLY="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          GIT_HOST="github.com"
          DOCS_SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME_ONLY}/"

          # Replace placeholders across all relevant files
          # Note: <YOUR_REPO_NAME_ONLY> is replaced before <YOUR_REPO_NAME> to avoid partial matches
          find . -type f \( -name "*.toml" -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -exec sed -i \
              -e "s|<YOUR_REPO_NAME_ONLY>|${REPO_NAME_ONLY}|g" \
              -e "s|<YOUR_REPO_NAME>|${REPO_NAME}|g" \
              -e "s|<YOUR_GIT_HOST>|${GIT_HOST}|g" \
              -e "s|<YOUR_IMAGE_NAME>|${REPO_NAME_ONLY}|g" \
              -e "s|<YOUR_SITE_AUTHOR>|${REPO_OWNER}|g" \
              -e "s|<YOUR_SOURCE_REPOSITORY>|${REPO_NAME}|g" \
              -e "s|<YOUR_DOCS_SITE_URL>|${DOCS_SITE_URL}|g" \
              {} +

      - name: Commit changes
        if: steps.check_initialized.outputs.needs_init == 'true'
        run: |
          git add -A
          git commit -m "chore: initialize repository from template - replace placeholders"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete initialization workflow
        if: steps.check_initialized.outputs.needs_init == 'true'
        run: |
          git rm .github/workflows/initialize_repo.yml
          git commit -m "chore: remove initialization workflow after setup"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
