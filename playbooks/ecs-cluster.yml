- name: Ensure inventory readiness
  hosts: all
  gather_facts: false
  tags:
    - readiness
  tasks:
    - name: Check if host is ready
      ansible.builtin.wait_for_connection:
        timeout: 60

# ECS Cluster Configuration and install
- name: Set up ECS cluster for Cloudera on premise
  hosts: localhost
  connection: local
  gather_facts: true
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
  vars:
    BASE_CLUSTER_NAME: "ozone-base-cluster"

  tasks:

    - name: Assert cloudera_ecs_admin_password meets complexity requirements
      ansible.builtin.assert:
        that:
          - cloudera_ecs_admin_password | length >= 8
          - cloudera_ecs_admin_password is regex('[A-Z]')
          - cloudera_ecs_admin_password is regex('[a-z]')
          - cloudera_ecs_admin_password is regex('[0-9]')
          - cloudera_ecs_admin_password is regex('[#&*$%@^._!]')
        fail_msg: >-
          cloudera_ecs_admin_password must be at least 8 characters and contain at least one
          uppercase letter, one lowercase letter, one number, and one symbol (#, &, *, $, %, @, ^, ., _, !).
        quiet: true

    - name: Retrieve parcels defails from CM config
      cloudera.cluster.cm_config_info:
        view: full
      register: __cm_config

    - name: Append the ECS parcels to existing parcels
      when: ecs_parcel_repo_url not in current_repo_url
      cloudera.cluster.cm_config:
        parameters:
          remote_parcel_repo_urls: "{{ current_repo_url + ',' + ecs_parcel_repo_url }}"
        message: Added specific version of ECS parcel
      delegate_to: localhost
      become: false
      vars:
        current_repo_url: "{{ __cm_config.config | selectattr('name', 'eq', 'REMOTE_PARCEL_REPO_URLS') | map(attribute='value') | first }}"

    - name: Establish the ECS cluster
      cloudera.cluster.cluster:
        name: "{{ name_prefix }}-ecs-cluster"
        display_name: ECS Cluster
        state: present
        type: EXPERIENCE_CLUSTER
        cluster_version: "{{ ecs_version }}"
      register: __cluster

- name: Provision ECS cluster hosts
  hosts: ecs
  gather_facts: false
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
  tags:
    - cluster
    - hosts
    - parcels
  tasks:
    - name: Provision host to ECS cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}" # str
        cluster: "{{ name_prefix }}-ecs-cluster"

- name: Provision ECS cluster parcels
  hosts: localhost
  gather_facts: false
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
  tags:
    - cluster
    - parcels
  tasks:
    - name: Activate parcels
      cloudera.cluster.parcel:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: "{{ __parcel.key }}"
        parcel_version: "{{ __parcel.value }}"
        state: "activated"
      loop: "{{ ecs_parcels | dict2items }}"
      loop_control:
        loop_var: __parcel
        label: "{{ __parcel.value }}"

- name: Provision ECS cluster services
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # These should be set in per-host role overrides by reading values from inventory (host variables)
    docker_default_data_path: "/mnt/docker"
    ecs_prometheus_ingress_password: "{{ common_password }}"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
  tags:
    - cluster
    - services
  tasks:
    - name: Get reference to cluster
      tags:
        - cluster
        - services
      cloudera.cluster.cluster:
        name: "{{ name_prefix }}-ecs-cluster"
      register: __cluster

    - name: Establish Docker service
      tags:
        - docker
        - services
      cloudera.cluster.service:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: docker
        type: DOCKER
        config:
          defaultDataPath: "{{ docker_default_data_path }}"
      register: __docker

    - name: Establish ECS service credentials
      tags:
        - ecs
        - services
      cloudera.cluster.service:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: ecs
        type: ECS
        skip_redacted: true
        config:
          # docker_user:
          # docker_password: ecs-docker_password
          cp_prometheus_ingress_password: "{{ ecs_prometheus_ingress_password }}"
          infra_prometheus_ingress_password: "{{ ecs_prometheus_ingress_password }}"
          k8s_webui_secret_admin_token: ecs-k8s_webui_secret_admin_token

    - name: Establish ECS service
      tags:
        - ecs
        - services
      cloudera.cluster.service:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: ecs
        type: ECS
        config:
          app_domain: "ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
          cluster_cidr: 172.42.0.0/16
          service_cidr: 172.43.0.0/16
          image_basepath: cdp-private
          defaultDataPath: /ecs/longhorn-storage
          docker_registry: container.repository.cloudera.com
          external_registry_enabled: true
          docker: docker
          cp_prometheus_ingress_user: cloudera-manager
          infra_prometheus_ingress_user: cloudera-manager
          longhorn_replication: 1
          lsoDataPath: /ecs/local-storage
          nfs_over_provisioning: 800
      register: __ecs

    - name: Establish ECSMaster host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: ECSMaster
        role_config_groups:
          - service: "{{ __docker.service.name }}"
            type: DOCKER_SERVER
          - service: "{{ __ecs.service.name }}"
            type: ECS_SERVER

    - name: Establish ECSWorker host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: "{{ name_prefix }}-ecs-cluster"
        name: ECSWorker
        role_config_groups:
          - service: "{{ __docker.service.name }}"
            type: DOCKER_SERVER
          - service: "{{ __ecs.service.name }}"
            type: ECS_AGENT

- name: Provision ECS cluster hosts
  hosts: ecs
  gather_facts: false
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
  tags:
    - cluster
    - hosts
    - parcels
  tasks:
    - name: Provision host to ECS cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}" # str
        cluster: "{{ name_prefix }}-ecs-cluster"
        host_template: "{{ host_template | default(omit) }}"

- name: Install the Control Plane and Manage ECS cluster state
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    BASE_CLUSTER_NAME: "ozone-base-cluster"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"

  tasks:
    - name: Install the ECS control plane
      cloudera.cluster.control_plane:
        name: "{{ name_prefix }}-ecs-cluster"
        datalake_cluster_name: "{{ BASE_CLUSTER_NAME }}"
        remote_repo_url: "{{ ecs_parcel_repo_url | regex_replace('parcels/.*', '') }}"
        type: embedded
        control_plane_config:
          ContainerInfo:
            Mode: public
            CopyDocker: false
          Database:
            Mode: embedded
            EmbeddedDbStorage: 200
          Services:
            thunderheadusermanagementprivate:
              Config:
                database:
                  name: db-ums
                admin:
                  username: admin
                  password: "{{ cloudera_ecs_admin_password }}"
          Vault:
            Mode: embedded
            EmbeddedDbStorage: 20
      register: __controlplane

    - name: Patch the ECS service config with the Caddy ingress certificate
      when: ingress_cert is defined
      cloudera.cluster.cm_resource:
        path: /clusters/{{ name_prefix }}-ecs-cluster/services/ecs/config
        method: PUT
        body:
          items:
            - name: ingress_controller_cert_contents
              value: "{{ ingress_cert }}"
      vars:
        ingress_cert: "{{ (lookup('file', [playbook_dir, name_prefix + '-caddy-root.crt'] | path_join) if caddy_self_signed else caddy_ca_pem) }}"

# Patch the Corefile configMap for coredns
# We set fowarding policy to sequential so that DNS servers in the host /etc/resolv.conf is parsed in top-to-bottom order
- name: Patch CoreDNS configmap on ECS master
  hosts: ecs_masters
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    kubectl_path: /var/lib/rancher/rke2/bin/kubectl
    configmap_name: rke2-coredns-rke2-coredns
    configmap_namespace: kube-system
  environment:
    PATH: "{{ kubectl_path | dirname }}:{{ ansible_env.PATH }}"
  tags:
    - coredns
  tasks:
    - name: Ensure kubectl binary is present
      ansible.builtin.stat:
        path: "{{ kubectl_path }}"
      register: kubectl_binary
      failed_when: kubectl_binary.stat.exists is not defined

    - name: Ensure the kubernetes Python package is installed
      ansible.builtin.pip:
        name: kubernetes
        version: 33.1.0        
        state: present

    - name: Get current CoreDNS configmap
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: "{{ configmap_name }}"
        namespace: "{{ configmap_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: __coredns_configmap

    - name: Update Corefile with sequential policy
      ansible.builtin.set_fact:
        __coredns_updated_corefile: >-
          {{ __coredns_configmap.resources[0].data.Corefile | regex_replace('forward\s+\.\s+/etc/resolv\.conf', 'forward  . /etc/resolv.conf {\n      policy sequential\n    }') }}
      when:
        - __coredns_configmap.resources | length > 0
        - not __coredns_configmap.resources[0].data.Corefile is regex('policy sequential')

    - name: Update the CoreDNS configmap
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ configmap_name }}"
            namespace: "{{ configmap_namespace }}"
          data:
            Corefile: "{{ __coredns_updated_corefile }}"
      register: __coredns_update_result
      when: __coredns_updated_corefile is defined

    - name: Restart CoreDNS pods to apply changes
      kubernetes.core.k8s:
        api_version: v1
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "{{ configmap_namespace }}"
        kind: Pod
        delete_all: true
        label_selectors:
          - k8s-app=kube-dns
        state: absent
      when: __coredns_update_result.changed

    - name: Get current infra-prometheus Ingress
      kubernetes.core.k8s_info:
        kind: Ingress
        name: infra-prometheus-operator-prometheus
        namespace: infra-prometheus
        kubeconfig: "{{ kubeconfig_path }}"
      register: __prometheus_ingress

    - name: Patch infra-prometheus Ingress annotations
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: "{{ __prometheus_ingress.resources[0].apiVersion }}"
          kind: Ingress
          metadata:
            name: infra-prometheus-operator-prometheus
            namespace: infra-prometheus
            annotations: "{{ __prometheus_ingress.resources[0].metadata.annotations | combine({'nginx.ingress.kubernetes.io/force-ssl-redirect': 'false', 'nginx.ingress.kubernetes.io/ssl-redirect': 'false'}) }}"
          spec: "{{ __prometheus_ingress.resources[0].spec }}"
      when: __prometheus_ingress.resources | length > 0

# Patch the Prometheus Ingress to disable SSL redirect
# Caddy is handling TLS termination for ECS
- name: Patch Prometheus Ingress
  hosts: ecs_masters
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    kubectl_path: /var/lib/rancher/rke2/bin/kubectl
    configmap_name: rke2-coredns-rke2-coredns
    configmap_namespace: kube-system
  environment:
    PATH: "{{ kubectl_path | dirname }}:{{ ansible_env.PATH }}"
  tags:
    - coredns
  tasks:
    - name: Ensure kubectl binary is present
      ansible.builtin.stat:
        path: "{{ kubectl_path }}"
      register: kubectl_binary
      failed_when: kubectl_binary.stat.exists is not defined

    - name: Ensure the kubernetes Python package is installed
      ansible.builtin.pip:
        name: kubernetes
        version: 33.1.0        
        state: present

    - name: Patch infra-prometheus Ingress annotations to disable SSL redirect
      block: 
        - name: Get current infra-prometheus Ingress
          kubernetes.core.k8s_info:
            kind: Ingress
            name: infra-prometheus-operator-prometheus
            namespace: infra-prometheus
            kubeconfig: "{{ kubeconfig_path }}"
          register: __infra_prometheus_ingress

        - name: Patch infra-prometheus Ingress annotations
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: "{{ __infra_prometheus_ingress.resources[0].apiVersion }}"
              kind: Ingress
              metadata:
                name: infra-prometheus-operator-prometheus
                namespace: infra-prometheus
                annotations: "{{ __infra_prometheus_ingress.resources[0].metadata.annotations | combine({'nginx.ingress.kubernetes.io/force-ssl-redirect': 'false', 'nginx.ingress.kubernetes.io/ssl-redirect': 'false'}) }}"
              spec: "{{ __infra_prometheus_ingress.resources[0].spec }}"
          when: __infra_prometheus_ingress.resources | length > 0

    - name: Patch prometheus-cp Ingress annotations to disable SSL redirect
      block: 
        - name: Get current prometheus-cp Ingress
          kubernetes.core.k8s_info:
            kind: Ingress
            name: cdp-release-prometheus-server
            namespace: cdp
            kubeconfig: "{{ kubeconfig_path }}"
          register: __prometheus_cp_ingress

        - name: Patch prometheus-cp Ingress annotations
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: "{{ __prometheus_cp_ingress.resources[0].apiVersion }}"
              kind: Ingress
              metadata:
                name: cdp-release-prometheus-server
                namespace: cdp
                annotations: "{{ __prometheus_cp_ingress.resources[0].metadata.annotations | combine({'nginx.ingress.kubernetes.io/force-ssl-redirect': 'false', 'nginx.ingress.kubernetes.io/ssl-redirect': 'false'}) }}"
              spec: "{{ __prometheus_cp_ingress.resources[0].spec }}"
          when: __prometheus_cp_ingress.resources | length > 0