- name: Retrieve keystore  and truststore password for Nifi configuration
  hosts: base_masters
  gather_facts: no
  become: yes
  tasks:
    - name: Read keystore password file
      ansible.builtin.command: cat /var/lib/cloudera-scm-agent/agent-cert/cm-auto-host_key.pw
      register: keystore_password_result
      changed_when: false

    - name: Set keystore password fact
      ansible.builtin.set_fact:
        keystore_password: "{{ keystore_password_result.stdout }}"

    - name: Get Truststore password from CM API
      delegate_to: localhost
      become: no
      ansible.builtin.uri:
        url: "https://cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/api/v58/certs/truststorePassword"
        method: GET
        headers:
          Accept: "text/plain"
        user: admin
        password: "{{ cloudera_manager_admin_password }}"
        force_basic_auth: yes
        validate_certs: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary(false, true) }}"
        return_content: yes
      register: truststore_password_response

    - name: Set truststore password fact
      ansible.builtin.set_fact:
        truststore_password: "{{ truststore_password_response.content }}"

- name: Provision OneNode cluster services
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    # These should be set in per-host role overrides by reading values from inventory (host variables)
    base_dn: "{{ dns_domain.split('.') | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"
    keystore_password: "{{ hostvars[groups['base_masters'][0]]['keystore_password'] }}"
    truststore_password: "{{ hostvars[groups['base_masters'][0]]['truststore_password'] }}"
    dfs_data_dir_list: "/dfs/dn2"
    dfs_name_dir_list: "/dfs/nn2"
    fs_checkpoint_dir_list: "/dfs/snn2"
    yarn_nodemanager_local_dirs: "/yarn/nm2"
    kafka_zookeeper_chroot: "/kafka2"
    zookeeper_data_dir: "/var/lib/zookeeper2"
    zookeeper_data_log_dir: "/var/lib/zookeeper2"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  handlers:
    - name: services updated
      ansible.builtin.set_fact:
        services_updated: yes
  tags:
    - cluster
    - services
  tasks:
    - name: Get reference to cluster
      cloudera.cluster.cluster:
        name: OneNodeCluster
      register: __cluster

    - name: Establish ZooKeeper service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: zookeeper
        type: ZOOKEEPER
        config:
          quorum_auth_enable_sasl: yes
          enableSecurity: yes
        role_config_groups:
          - type: SERVER
            config:
              dataDir: "{{ zookeeper_data_dir }}"
              dataLogDir: "{{ zookeeper_data_log_dir }}"
      register: __zookeeper
      notify: services updated

    - name: Establish HDFS service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hdfs
        type: HDFS
        config:
          dfs_replication: 1
          hdfs_under_replicated_blocks_thresholds: "{{ {'warning': 90, 'critical': 95} | to_json }}"
          dfs_encrypt_data_transfer_algorithm: AES/CTR/NoPadding
          hadoop_secure_web_ui: yes
          core_connector: "{{ __cluster.cloudera_manager.tags['_cldr_cluster.core_settings.service_name'] }}"
        role_config_groups:
          - type: DATANODE
            config:
              dfs_data_dir_list: "{{ dfs_data_dir_list | string }}"
          - type: NAMENODE
            config:
              dfs_name_dir_list: "{{ dfs_name_dir_list | string }}"
          - type: SECONDARYNAMENODE
            config:
              fs_checkpoint_dir_list: "{{ fs_checkpoint_dir_list | string }}"
      register: __hdfs
      notify: services updated

    - name: Establish Solr service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: solr
        type: SOLR
        config:
          solr_security_authentication: kerberos
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          # ranger_service: "{{ __ranger.service.name }}"
      register: __solr
      notify: services updated

    - name: Establish Ranger service credentials
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: ranger
        type: RANGER
        config:
          rangerusersync_user_password: "{{ ranger_password }}"
          rangertagsync_user_password: "{{ ranger_password }}"
          keyadmin_user_password: "{{ ranger_password }}"
          ranger_database_password: "{{ ranger_password }}"
          rangeradmin_user_password: "{{ ranger_password }}"
        skip_redacted: yes

    - name: Establish Ranger service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: ranger
        type: RANGER
        config:
          ranger_database_host: "{{ groups['postgresql'] | first }}"
          hdfs_service: "{{ __hdfs.service.name }}"
          solr_service: "{{ __solr.service.name }}"
        role_config_groups:
          - type: RANGER_USERSYNC
            config:
              ranger.usersync.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              ranger.usersync.ldap.binddn: "uid=ldap_bind_user,cn=users,cn=accounts,{{ base_dn }}"
              ranger_usersync_ldap_ldapbindpassword: "{{ common_password }}"
              ranger.usersync.ldap.user.searchbase: "cn=users,cn=accounts,{{ base_dn }}"
              ranger.usersync.ldap.user.objectclass: "person"
              ranger.usersync.ldap.user.nameattribute: "uid"
              ranger.usersync.group.searchbase: "cn=groups,cn=accounts,{{ base_dn }}"
              ranger.usersync.group.objectclass: "ipausergroup"
              ranger.usersync.group.nameattribute: "cn"
              ranger.usersync.group.memberattributename: "member"
      register: __ranger
      notify: services updated

    - name: Establish YARN service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: yarn
        type: YARN
        config:
          hadoop_secure_web_ui: yes
          hdfs_service: "{{ __hdfs.service.name }}"
        role_config_groups:
          - type: NODEMANAGER
            config:
              yarn_nodemanager_local_dirs: "{{ yarn_nodemanager_local_dirs | string }}"
          - type: GATEWAY
            config:
              mapred_submit_replication: 4
      register: __yarn
      notify: services updated

    - name: Establish Tez service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: tez
        type: TEZ
        config:
          yarn_service: "{{ __yarn.service.name }}"
      register: __tez
      notify: services updated

    - name: Establish Ozone service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: ozone
        type: OZONE
        config:
          ozone.service.id: ozone
          ozone.scm.service.id: ozone
          ozone.scm.primordial.node.id: "{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}"
          ozone.replication: 1
          ozone.security.enabled: yes
          solr_service: solr
          ozone-conf/ozone-site.xml_service_safety_valve: >-
            <property>
              <name>ozone.om.service.ids</name>
              <value>ozone</value>
              <final>true</final>
            </property>
            <property>
              <name>ozone.om.address.ozone.om1</name>
              <value>{{ groups['cluster'] | first }}:9862</value>
              <final>true</final>
            </property>
            <property>
              <name>ozone.om.nodes.ozone</name>
              <value>om1</value>
              <final>true</final>
            </property>
            <property>
              <name>ozone.scm.address.ozone.node1</name>
              <value>{{ groups['cluster'] | first }}</value>
              <final>true</final>
            </property>
        role_config_groups:
          - type: STORAGE_CONTAINER_MANAGER
            config:
              scm_max_heap_size: 1024
              ozone-conf/ozone-site.xml_role_safety_valve: >-
                <property>
                  <name>hdds.scm.safemode.enabled</name>
                  <value>false</value>
                </property>
          - type: OZONE_MANAGER
            config:
              ozone.server.default.replication: 1
              om_max_heap_size: 1024
          - type: OZONE_RECON
            config:
              ozone_recon_max_heap_size: 1024
          - type: S3_GATEWAY
            config:
              ozone_S3_gateway_max_heap_size: 256
      register: __ozone
      notify: services updated

    - name: Establish Kafka service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: kafka
        type: KAFKA
        config:
          ranger_service: "{{ __ranger.service.name }}"
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          zookeeper.chroot: "{{ kafka_zookeeper_chroot }}"
          kerberos.auth.enable: yes
          service_triggers: "[{\"enabled\":true,\"expressionEditorConfig\":null,\"streamThreshold\":0,\"suppressed\":false,\"triggerExpression\":\"IF (SELECT kafka_log_directory_disk_free_space/kafka_log_directory_disk_total_space WHERE serviceName=$SERVICENAME AND last(kafka_log_directory_disk_free_space/kafka_log_directory_disk_total_space) < 0.1) DO health:bad\",\"triggerName\":\"Kafka Broker Log Directory Free Capacity Check\",\"validityWindowInMs\":120000}]"
          # Enable Kafka-Nifi over PAM 
          # sasl.plain.auth: PAM
          sasl.plain.auth: LDAP
          ldap.auth.url: "ldaps://{{ groups['freeipa'] | first }}"
          ldap.auth.user.dn.template: "uid={0},cn=users,cn=accounts,dc=cldr,dc=internal"
          # One Node Specific configurations
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
        role_config_groups:
          - type: KAFKA_BROKER
            config:
              # atlas.audit.enabled: true
              broker_max_heap_size: 1024
          - type: KAFKA_CONNECT
            config:
              offset.storage.replication.factor: 1
              config.storage.replication.factor: 1
              status.storage.replication.factor: 1
      register: __kafka
      notify: services updated

    - name: Establish HBase service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hbase
        type: HBASE
        config:
          hbase_thriftserver_security_authentication: auth-conf
          hbase_security_authentication: kerberos
          hbase_security_authorization: yes
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
      register: __hbase
      notify: services updated

    - name: Establish Atlas service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: atlas
        type: ATLAS
        config:
          kerberos.auth.enable: yes
          hdfs_service: "{{ __hdfs.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          kafka_service: "{{ __kafka.service.name }}"
          solr_service: "{{ __solr.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
        role_config_groups:
          - type: ATLAS_SERVER
            config:
              atlas_authentication_method_ldap_type: ldap
              atlas_authentication_method_ldap_base_dn: "cn=accounts,{{ base_dn }}"
              atlas_authentication_method_ldap_user_searchfilter: "(objectClass=person)"
              atlas_authentication_method_ldap_bind_password: "{{ common_password }}"
              atlas_authentication_method_ldap_groupSearchBase: "cn=groups,cn=accounts,{{ base_dn }}"
              atlas_authentication_method_ldap_bind_dn: "ldap_bind_user"
      register: __atlas
      notify: services updated

    - name: Establish Hive service credentials
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hive
        type: HIVE
        config:
          hive_metastore_database_password: "{{ hive_password }}"
        skip_redacted: yes

    - name: Establish Hive service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hive
        type: HIVE
        config:
          hive_metastore_database_host: "{{ groups['postgresql'] | first }}"
          hive_metastore_database_type: postgresql
          hive_metastore_database_name: hive
          hive_metastore_database_port: 5432
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          mapreduce_yarn_service: "{{ __yarn.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
          hiveserver2_enable_ldap_auth: true
          hive_metastore_enable_ldap_auth: true
          hiveserver2_ldap_uri:    "ldaps://{{ groups['freeipa'] | first }}"
          hive_metastore_ldap_uri: "ldaps://{{ groups['freeipa'] | first }}"
          hiveserver2_ldap_basedn:    "cn=users,cn=accounts,{{ base_dn }}"
          hive_metastore_ldap_basedn: "cn=users,cn=accounts,{{ base_dn }}"
        role_config_groups:
          - type: HIVEMETASTORE
            config:
              hive_metastore_server_max_message_size: 349909811 # <Hive's max message size> 1/10 size of hive_metastore_java_heapsize
              hive_metastore_java_heapsize: 3499098112  # Hive's heapsize by default is 8
      register: __hive
      notify: services updated

    - name: Establish Hive-on-Tez service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hive_on_tez
        type: HIVE_ON_TEZ
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          hms_connector: "{{ __hive.service.name }}"
          tez_service: "{{ __tez.service.name }}"
          mapreduce_yarn_service: "{{ __yarn.service.name }}"
      register: __hive_on_tez
      notify: services updated

    - name: Establish Knox service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: knox
        type: KNOX
        skip_redacted: yes
        config:
          knox_gateway_database_password: "{{ knox_db_enabled | ternary(knox_password, omit) }}"
          knox_gateway_database_host: "{{ knox_db_enabled | ternary(groups['postgresql'] | first, omit) }}"
          knox_gateway_database_user: "{{ knox_db_enabled | ternary('knox', omit) }}"
          knox_gateway_database_name: "{{ knox_db_enabled | ternary('knox', omit) }}"
          kerberos.auth.enabled: yes
          knox_homepage_logout_enabled: true
          # ranger_service: "{{ __ranger.service.name }}"
          # hdfs_service: "{{ __hdfs.service.name }}"
          "conf/gateway-site.xml_service_safety_valve": >-
            <property>
              <name>gateway.frontend.url</name>
              <value>https://knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/gateway</value>
            </property>
            <property>
              <name>gateway.servlet.async.supported</name>
              <value>true</value>
            </property>
          knoxsso_redirect_whitelist_regex: "^https?:\\/\\/(.*pvc\\.cloudera-labs\\.com)(?::[0-9]+)?(?:\\/.*)?$"
        role_config_groups:
          - type: KNOX_GATEWAY
            config:
              gateway_master_secret: "{{ knox_password }}"
              gateway_dispatch_whitelist: "^https?:\\/\\/(.*\\.cldr\\.internal)(?::[0-9]+)?(?:\\/.*)?$"
              gateway_descriptor_cdp_proxy: "providerConfigRef=sso#provisionEncryptQueryStringCredential=false#DATAVIZ:url=https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}:8100/#SSB-SSE-UI:url=https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}:18121#SSB-SSE-UI:httpclient.connectionTimeout=5m#SSB-SSE-UI:httpclient.socketTimeout=5m#SSB-SSE-WS:url=wss://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}:18121"
              gateway_descriptor_cdp_proxy_api: "providerConfigRef=pam#provisionEncryptQueryStringCredential=false#SSB-SSE-API:url=https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}:18121#DATAVIZ:url=https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}:8100/"
      vars:
        knox_db_enabled: "{{ cloudera_runtime_version is version('7.3.1', 'ge', version_type='loose') }}"
      register: __knox
      # notify: services updated # Always returns TRUE until we have the suppress_redacted flag enabled

    - name: Establish Flink service
      tags:
        - flink
        - ssb
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: flink
        type: FLINK
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          yarn_service: "{{ __yarn.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          kerberos.auth.enabled: true
      register: __flink
      notify: services updated

    - name: Establish Kudu service
      tags:
        - kudu
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: kudu
        type: KUDU
        config:
          # sentry_service: "none"
        role_config_groups:
          - type: KUDU_MASTER
            config:
              default_num_replicas: 1
              fs_wal_dir: "/kudu/master/wal"
              fs_data_dirs: "/kudu/master/data"
          - type: KUDU_TSERVER
            config:
              fs_wal_dir: "/kudu/tablet/wal"
              fs_data_dirs: "/kudu/tablet/data"
      register: __kudu
      notify: services updated

    - name: Establish Impala service
      tags:
        - impala
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: impala
        type: IMPALA
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          hive_service: "{{ __hive.service.name }}"
          kudu_service: "{{ __kudu.service.name }}"
      register: __impala
      notify: services updated

    - name: Establish Spark3 History service
      tags:
        - spark
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: spark3_on_yarn
        type: SPARK3_ON_YARN
        config:
          yarn_service: "{{ __yarn.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
          knox_service: "{{ __knox.service.name }}"
        role_config_groups:
          - type: SPARK3_YARN_HISTORY_SERVER
            config:
              history_server_max_heapsize: 536870912 # 512MB
      register: __spark
      notify: services updated

    - name: Establish Livy for Spark service
      tags:
        - livy
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: livy
        type: LIVY_FOR_SPARK3
        config:
          yarn_service: "{{ __yarn.service.name }}"
          spark3_on_yarn_service: "{{ __spark.service.name }}"
      register: __livy
      notify: services updated

    - name: Establish SQL Stream Builder service credentials
      tags:
        - ssb
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: sql_stream_builder
        type: SQL_STREAM_BUILDER
        skip_redacted: yes
        config:
          database_password: "{{ ssb_admin_password }}"
        role_config_groups:
          - type: MATERIALIZED_VIEW_ENGINE
            config:
              ssb.mve.datasource.password: "{{ ssb_mve_password }}"

    - name: Establish Streams Messaging Manager service
      tags:
        - smm
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: streams_messaging_manager
        type: STREAMS_MESSAGING_MANAGER
        skip_redacted: yes
        config:
          smm_database_host: "{{ groups['postgresql'] | first }}"
          smm_database_type: postgresql
          smm_database_name: streamsmsgmgr
          smm_database_port: 5432
          smm_database_password: "{{ smm_password }}"
          kafka_service: "{{ __kafka.service.name }}"
          kerberos.auth.enable: yes
        role_config_groups:
          - type: STREAMS_MESSAGING_MANAGER_SERVER
            config:
              streams.messaging.manager.internal.topics.replication.factor: 1
      register: __smm
      notify: services updated

    - name: Establish SQL Stream Builder service
      tags:
        - ssb
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: sql_stream_builder
        type: SQL_STREAM_BUILDER
        config:
          flink_service: "{{ __flink.service.name }}"
          kafka_service: "{{ __kafka.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          database_host: "{{ groups['postgresql'] | first }}"
          security.kerberos.enabled: true
        role_config_groups:
          - type: MATERIALIZED_VIEW_ENGINE
            config:
              ssb.mve.datasource.username: ssb_mve
              ssb.mve.datasource.url: "jdbc:postgresql://{{ groups['postgresql'] | first }}:5432/ssb_mve"
          - type: STREAMING_SQL_ENGINE
            config:
              ssb.yarn.ui.proxy: "https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}/gateway/cdp-proxy/yarnuiv2/proxy"
              ssb.mve.proxy: "https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}/gateway/cdp-proxy-api/ssb-mve-api"
      register: __ssb
      notify: services updated

    - name: Set NiFi JDK path variable only for CFM 4.x
      set_fact:
        nifi_jdk_home: "{{ '/usr/lib/jvm/zulu21' if cloudera_parcels.CFM is defined and cloudera_parcels.CFM | regex_search('^4\\.') else '' }}"

    - name: Establish Nifi service
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: nifi
        type: NIFI
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_NODE
            config:
              nifi.jdk.home: "{{ nifi_jdk_home }}"
              nifi.web.https.port: 8445
              nifi.ldap.enabled: true
              nifi.ldap.authentication.strategy: LDAPS
              nifi.ldap.manager.dn: "uid=admin,cn=users,cn=accounts,{{ base_dn }}"
              nifi.ldap.manager.password: "{{ common_password }}"
              nifi.ldap.tls.client.auth: NONE
              nifi.ldap.tls.protocol: TLSv1.2
              nifi.ldap.tls.truststore: /var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks
              nifi.ldap.tls.truststore.password: "{{ truststore_password }}"
              nifi.ldap.tls.truststore.type: JKS
              nifi.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              nifi.ldap.user.search.base: "cn=users,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Member Attribute: member
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Name Attribute: cn
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Object Class: posixgroup
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Search Base: "cn=groups,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Sync Interval: 1 min
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Group Name Attribute: memberOf
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Identity Attribute: uid
              xml.loginIdentityProviders.provider.ldap-provider.property.Identity Strategy: USE_USERNAME
              xml.loginIdentityProviders.provider.ldap-provider.property.User Search Filter: "uid={0}"
              staging/authorizers.xml_role_safety_valve: "<property><name>xml.authorizers.userGroupProvider.composite-configurable-user-group-provider.property.User Group Provider 2</name><value>ldap-user-group-provider</value></property>"
              nifi.security.identity.mapping.pattern.kerb: "^(.*?)(/.*?)?@(.*?)$"
              nifi.security.identity.mapping.transform.kerb: LOWER
              nifi.security.identity.mapping.value.kerb: "$1"
              
      register: __nifi
      notify: services updated

    - name: Establish Nifi Registry service
      tags:
        - nifiregistry
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: nifiregistry
        type: NIFIREGISTRY
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          nifi_service: "{{ __nifi.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_REGISTRY_SERVER
            config:
              nifi.registry.jdk.home: "{{ nifi_jdk_home }}"
              nifi.registry.ldap.enabled: true
              nifi.registry.ldap.authentication.strategy: LDAPS
              nifi.registry.ldap.manager.dn: "uid=admin,cn=users,cn=accounts,{{ base_dn }}"
              nifi.registry.ldap.manager.password: "{{ common_password }}"
              nifi.registry.ldap.tls.client.auth: NONE
              nifi.registry.ldap.tls.protocol: TLSv1.2
              nifi.registry.ldap.tls.truststore: /var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks
              nifi.registry.ldap.tls.truststore.password: "{{ truststore_password }}"
              nifi.registry.ldap.tls.truststore.type: JKS
              nifi.registry.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              nifi.registry.ldap.user.search.base: "cn=users,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Member Attribute: member
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Name Attribute: cn
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Object Class: posixgroup
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Search Base: "cn=groups,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Sync Interval: "1 mins"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Group Name Attribute: memberOf
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Identity Attribute: uid
              xml.identityProviders.provider.ldap-provider.property.Identity Strategy: USE_USERNAME
              xml.identityProviders.provider.ldap-provider.property.User Search Filter: "uid={0}"
              staging/authorizers.xml_role_safety_valve: "<property><name>xml.authorizers.userGroupProvider.composite-configurable-user-group-provider.property.User Group Provider 2</name><value>ldap-user-group-provider</value></property>"
              nifi.registry.security.identity.mapping.pattern.kerb: "^(.*?)(/.*?)?@(.*?)$"
              nifi.registry.security.identity.mapping.transform.kerb: LOWER
              nifi.registry.security.identity.mapping.value.kerb: "$1"
              nifi.registry.security.identity.mapping.transform.dn: LOWER
      register: __nifiregistry
      notify: services updated

    - name: Establish Hue service
      tags:
        - hue
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hue
        type: HUE
        skip_redacted: yes
        config:
          database_host: "{{ groups['postgresql'] | first }}"
          database_type: postgresql
          database_name: hue
          database_port: 5432
          database_password: "{{ hue_password }}"
          hdfs_service: "{{ __hdfs.service.name }}"
          hive_service: "hive_on_tez"
          hms_service: "{{ __hive.service.name }}"
          impala_service: "{{ __impala.service.name }}"
          hue_service_safety_valve: |
            [desktop]
            secure_proxy_ssl_header=true
            use_x_forwarded_host=true
            
            [[ozone]]
            [[[default]]]
            fs_defaultfs=ofs://ozone
            webhdfs_url=https://{{ groups['cluster'] | first }}:9778/webhdfs/v1
            ssl_cert_ca_verify=true
            security_enabled=true
            
            [[session]]
            csrf_trusted_origins=https://knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}
            trusted_origins=knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}
            secure_cookies=true
      register: __hue
      notify: services updated

    - name: Establish Dataviz service
      tags:
        - dataviz
        - host_template
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: dataviz
        type: DATAVIZ
        skip_redacted: yes
        config:
          METASTORE_DB_HOST: "{{ groups['postgresql'] | first }}"
          METADATA_STORE: postgresql
          METASTORE_DB_USER: dataviz
          METASTORE_DB_PASSWORD: dataviz
          ADMIN_USERS: "admin"
          kerberos.auth.enable: yes
          AUTHENTICATION_BACKENDS: "arcwebbase.backends.KnoxSpnegoDjangoBackend,django.contrib.auth.backends.ModelBackend" # This is config required for KNOX SSO
      register: __dataviz
      notify: services updated

    - name: Enable AutoTLS on the cluster (post-services configuration)
      tags:
        - cluster
        - tls
      cloudera.cluster.cluster:
        name: OneNodeCluster
        auto_tls: yes
      notify: services updated

    - name: Configure NiFi service keystore password
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: nifi
        type: NIFI
        config:
        role_config_groups:
          - type: NIFI_NODE
            config:
              ssl_server_keystore_keypassword: "{{ keystore_password }}"
      notify: services updated

    - name: Establish unified OneNodeCluster host template
      tags:
