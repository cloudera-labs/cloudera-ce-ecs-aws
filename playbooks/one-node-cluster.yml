- name: Provision OneNodeCluster hosts
  hosts: cluster
  gather_facts: no
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - hosts
    - parcels
  tasks:
    - name: Provision host to cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}"
        cluster: OneNodeCluster

# TODO Update host template to use cloudera.cluster.host once it supports applying host templates to single host.
- name: Apply OneNodeCluster Host Template to host
  hosts: cluster
  gather_facts: no
  tags:
    - cluster
    - roles
  module_defaults:
    group/cloudera.cluster.cm:
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tasks:
    # - name: Get Cloudera Manager API version
    #   delegate_to: localhost
    #   cloudera.cluster.cm_endpoint_info:
    #     host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
    #   register: __cm_api

    - name: Get Cloudera Manager Hosts 
      delegate_to: localhost
      cloudera.cluster.cm_resource_info:
        # url: "{{ __cm_api.endpoint }}"
        url: "https://cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/api/v57"
        path: "/hosts"
        parameters:
          view: "SUMMARY"
      register: __cm_hosts

    - name: Get hostId from Hosts
      set_fact:
        hostId: "{{ __cm_hosts.resources | selectattr('hostname', 'equalto', inventory_hostname) | map(attribute='hostId') | first }}"

    - name: Apply Host Template
      delegate_to: localhost
      cloudera.cluster.cm_resource:
        url: "https://cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/api/v57"
        path: "/clusters/OneNodeCluster/hostTemplates/OneNodeCluster/commands/applyHostTemplate"
        method: POST
        parameters:
          runConfigRules: "false"
          startRoles: "false"
        body:
          items:
            - hostname: "{{ inventory_hostname }}"
              hostId: "{{ hostId }}"     

- name: Configure Hue WebHDFS with NAMENODE role reference
  hosts: localhost
  connection: local
  gather_facts: no
  tags:
    - cluster
    - hue
    - post_config
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  handlers:
    - name: services updated
      ansible.builtin.set_fact:
        services_updated: yes
  tasks:
    - name: Get NAMENODE role reference
      cloudera.cluster.service_role_info:
        cluster: OneNodeCluster
        service: hdfs
        type: NAMENODE
      register: __namenode_roles

    - name: Update Hue WebHDFS configuration
      when: __namenode_roles.roles | length > 0
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: hue
        type: HUE
        config:
          hue_webhdfs: "{{ __namenode_roles.roles[0].name }}"
      notify: services updated

- name: Add Dataviz topology to Knox
  hosts: cluster
  become: yes
  gather_facts: no
  tags:
    - knox
    - dataviz
  vars:
    cm_license_path: "{{ lookup('env', 'CDP_LICENSE_FILE')}}"
    cloudera_manager_repo_username: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).uuid }}"
    cloudera_manager_repo_password: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).password }}"
    cloudera_knox_services_directory: "/opt/cloudera/parcels/CDH/lib/knox/data/services"
    dataviz_version: "{{ cloudera_parcels.DATAVIZ.split('-')[0] }}"
    dataviz_build: "{{ cloudera_parcels.DATAVIZ }}"
    dataviz_knox_archive: "DATAVIZ-KNOX-{{ dataviz_build }}.tgz"
    dataviz_knox_url: "https://archive.cloudera.com/p/cdv/{{ dataviz_version }}/redhat8/yum/{{ dataviz_knox_archive }}"
  tasks:
    - name: Create temporary dataviz directory
      ansible.builtin.tempfile:
        state: directory
      register: __dataviz_tempdir

    - name: Download Dataviz Knox CSD tarball to temporary directory
      ansible.builtin.get_url:
        url: "{{ dataviz_knox_url }}"
        dest: "{{ __dataviz_tempdir.path }}/{{ dataviz_knox_archive }}"
        url_username: "{{ cloudera_manager_repo_username }}"
        url_password: "{{ cloudera_manager_repo_password }}"
        mode: 0644

    - name: Extract tarball from temporary directory to Knox services directory
      ansible.builtin.unarchive:
        src: "{{ __dataviz_tempdir.path }}/{{ dataviz_knox_archive }}"
        dest: "{{ cloudera_knox_services_directory }}"
        owner: root
        group: root
        remote_src: yes
        mode: 0755

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ __dataviz_tempdir.path }}"
        state: absent

- name: Manage OneNode cluster state
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - state
  tasks:
    - name: Ensure OneNode cluster started
      cloudera.cluster.cluster:
        name: OneNodeCluster
        state: "{{ services_updated | default(False) | ternary('restarted', 'started') }}"
        force: yes # Force first run

    - name: Reset cluster status variable
      when: services_updated is defined
      ansible.builtin.set_fact:
        services_updated: no

    - name: Query CMS status
      cloudera.cluster.cm_service_info:
      register: __cms

    - name: Refresh CMS configuration
      when: __cms.service.config_staleness_status == "STALE"
      cloudera.cluster.cm_service:
        state: restarted
