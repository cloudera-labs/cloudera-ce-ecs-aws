# # Cloudera Streaming Analytics Cluster
# #
# # Setting up your HDFS Home directory
# # - https://docs.cloudera.com/csa/1.15.0/installation/topics/csa-hdfs-home-install.html
# #
# # Setting the Java executable for the Flink client
# # - https://docs.cloudera.com/csa/1.15.0/installation/topics/csa-java-home-install.html

---

- name: Configure hosts for OneNode cluster services
  hosts: base_masters
  gather_facts: yes
  become: yes
  tags:
    - prereqs
  roles:
    - cloudera.exe.prereq_kafka
    - cloudera.exe.prereq_atlas
    - cloudera.exe.prereq_hbase
    - cloudera.exe.prereq_hdfs
    - cloudera.exe.prereq_hive
    - cloudera.exe.prereq_knox
    - cloudera.exe.prereq_ranger
    - cloudera.exe.prereq_yarn
    - cloudera.exe.prereq_zookeeper
    - cloudera.exe.prereq_hue
    - cloudera.exe.prereq_flink
    - cloudera.exe.prereq_ssb
    - cloudera.exe.prereq_impala
    - cloudera.exe.prereq_smm
    - cloudera.exe.prereq_kudu
    - cloudera.exe.prereq_nifi
    - cloudera.exe.prereq_nifiregistry
    - cloudera.exe.postgresql_client
    - cloudera.exe.prereq_dataviz

- name: Configure database settings for OneNode cluster services
  hosts: postgresql
  gather_facts: yes
  become: yes
  tags:
    - databases
  vars:
    database_type: "postgresql"
    database_host: "{{ groups['postgresql'] | first }}"
  roles:
    - cloudera.exe.prereq_ranger_database
    - cloudera.exe.prereq_hive_database
    - cloudera.exe.prereq_knox_database
    - cloudera.exe.prereq_ssb_database
    - cloudera.exe.prereq_hue_database
    - cloudera.exe.prereq_smm_database
    - cloudera.exe.prereq_schemaregistry_database
    - cloudera.exe.prereq_dataviz_database


- name: Configure reverse proxy for OneNode cluster services
  hosts: reverse_proxy
  gather_facts: yes
  become: yes
  tags:
    - reverse_proxy
  vars:
    tf_inventory: "{{ playbook_dir }}/../tf_cluster_aws"
    external_subdomain: "{{ lookup('cloud.terraform.tf_output', 'gateways', project_path=tf_inventory) | map(attribute='public_ip') | first }}"
    caddy_service: caddy
  handlers:
    - name: Reload Caddy
      ansible.builtin.service:
          name: caddy
          state: reloaded
  tasks:
    - name: Install Knox reverse proxy
      ansible.builtin.template:
        src: knox.caddyfile.j2
        dest: /etc/caddy/Caddyfile.d/knox.caddyfile
      vars:
        external_domain: "knox.{{ external_subdomain }}.{{ public_domain }}"
        knox_proxy_fqdn: "{{ groups['cluster'] | first }}"
      notify: Reload Caddy

- name: Configure OneNode parcels and CSDs
  hosts: base_masters
  gather_facts: no
  become: yes
  tags:
    - csds
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tasks:
    - name: Install available  CSDs
      ansible.builtin.include_role:
        name: cloudera.exe.cm_csd
      vars:
        cm_license_path: "{{ lookup('env', 'CDP_LICENSE_FILE')}}"
        cloudera_manager_repo_username: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).uuid }}"
        cloudera_manager_repo_password: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).password }}"
        cloudera_manager_csd_restarted: yes
        # cloudera_manager_csds: # from config.yml

    - name: Check availablity of Cloudera Manager
      ansible.builtin.wait_for:
        port: 7183
        delay: 10
        timeout: 240
        sleep: 10

    - name: Configure available OneNode parcels
      cloudera.cluster.cm_config:
        parameters:
          remote_parcel_repo_urls: "{{ cloudera_parcel_repo_urls | join(',') }}"
      delegate_to: localhost
      become: no
      vars:
        # cloudera_parcel_repo_urls: # from config.yml

- name: Provision OneNode cluster core
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    # These should be set in per-host role overrides by reading values from inventory (host variables)
    dfs_data_dir_list: "/dfs/dn"
    dfs_name_dir_list: "/dfs/nn"
    fs_checkpoint_dir_list: "/dfs/snn"
    yarn_nodemanager_local_dirs: "/yarn/nm"
    kafka_zookeeper_chroot: "/kafka"
    zookeeper_data_dir: "/var/lib/zookeeper"
    zookeeper_data_log_dir: "/var/lib/zookeeper"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  handlers:
    - name: services updated
      ansible.builtin.set_fact:
        services_updated: yes
  tags:
    - cluster
  tasks:
    - name: Set persistent cluster status
      ansible.builtin.set_fact:
        services_updated: no

    - name: Establish the cluster
      cloudera.cluster.cluster:
        name: OneNodeCluster
        display_name: Cloudera Streaming Analytics
        type: BASE_CLUSTER
        cluster_version: "{{ cloudera_runtime_version }}"
      register: __cluster
      notify: services updated

    - name: Establish core settings service
      tags:
        - core
      cloudera.cluster.service:
        cluster: OneNodeCluster
        name: "{{ __cluster.cloudera_manager.tags['_cldr_cluster.core_settings.service_name'] }}"
        type: CORE_SETTINGS
        config:
          hadoop_security_authorization: True
          hadoop_security_authentication: "kerberos"
      notify: services updated

- name: Provision OneNode cluster hosts
  hosts: cluster
  gather_facts: no
  vars:
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - hosts
    - parcels
  tasks:
    - name: Provision host to cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}"
        cluster: OneNodeCluster

- name: Provision OneNode cluster parcels
  hosts: localhost
  gather_facts: no
  vars:
    parcel_list: "{{ cloudera_parcels }}"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - parcels
  tasks:
    - name: Activate parcels
      cloudera.cluster.parcel:
        cluster: OneNodeCluster
        name: "{{ __parcel.key }}"
        parcel_version: "{{ __parcel.value }}"
        state: "activated"
      loop: "{{ parcel_list | dict2items }}"
      loop_control:
        loop_var: __parcel
        label: "{{ __parcel.value }}"

