- name: Ensure inventory readiness
  hosts: all
  gather_facts: false
  tags:
    - readiness
  tasks:
    - name: Check if host is ready
      ansible.builtin.wait_for_connection:
        timeout: 60

- name: Set up Cloudera Data Engineering Service on ECS
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    ecs_env_name: ecs
  tasks:

    # - name: Assert that Control Plane is reachable
    #   block:
    #     - name: Confirm Control Plane Authentication
    #       cloudera.cloud.iam_user_info:
    #         current_user: true
    #         verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
    #   rescue:
    #     - name: Print error if Authentication is unsuccessful
    #       fail:
    #         msg: "Authentication to ECS control plane failed. Please check your credentials, and network connectivity to the control plane."

    - name: Fetch FreeIPA CA certificate
      ansible.builtin.uri:
        url: "https://freeipa.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/ipa/config/ca.crt"
        method: GET
        validate_certs: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
        return_content: true
      register: __freeipa_ca_cert_response
      delegate_to: localhost

    - name: Upload FreeIPA certificate to Control Plane LDAP provider
      ansible.builtin.command:
        cmd: >
          cdpcurl -X POST
          'https://console-cdp.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/api/v1/iam/updateLdapProvider'
          -H 'content-type: application/json'
          -d '{{ ldap_provider_config | to_json }}'
          --insecure
      vars:
        ldap_provider_config:
          ldapProviderName: "cm-ldap"
          skipGroupSyncOnLogin: false
          url: "ldaps://{{ groups['freeipa'] | first }}"
          useAnonymousBind: "bind_dn_password"
          userSearchBase: "cn=users,cn=accounts,dc=cldr,dc=internal"
          userSearchFilter: "(uid={0})"
          usernameMappingAttribute: uid
          emailMappingAttribute: ""
          groupSearchBase: "cn=groups,cn=accounts,dc=cldr,dc=internal"
          groupSearchFilter: "(&(member={0})(objectClass=posixgroup)(! ( | (cn=admins) (cn=ipausers) ) ))"
          tlsCaCertificates:
            - "{{ __freeipa_ca_cert_response.content }}"
          bindDn: "uid=admin,cn=users,cn=accounts,dc=cldr,dc=internal"
          bindPassword: "{{ freeipa_password | default(lookup('env', 'IPA_PASSWORD', default='')) }}"

    - name: Enable CDE service
      cloudera.cloud.de:
        env: "{{ ecs_env_name }}"
        name: "{{ name_prefix }}-de"
        instance_type: 'private' 
        cpu_requests: 24
        memory_requests: '64Gi'
        resource_pool: "root.{{ ecs_env_name }}.cde"
        verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
        wait: yes
      register: __cde_service

    - name: Set service ID
      ansible.builtin.set_fact:
        service_id: "{{ __cde_service.service.clusterFqdn | regex_replace('^service\\.', '') }}"

    - name: Debug service ID
      ansible.builtin.debug:
        var: service_id

# Install Caddyfile for workbench wildcard
# NOTE: Play runs against proxy host
- name: Configure Caddy entry for Cloudera CDE Service
  hosts: reverse_proxy
  gather_facts: true
  become: true
  tags:
    - reverse_proxy
    - proxy
    - cm_autotls
  vars:
    caddy_service: caddy
  handlers:
    - name: Reload Caddy
      ansible.builtin.service:
        name: "{{ caddy_service }}"
        state: reloaded
  tasks:
    - name: Install CDE reverse proxy
      when: groups['ecs_masters'] is defined and groups['ecs_masters'] | length > 0
      ansible.builtin.template:
        src: cloudera_cde.caddyfile.j2
        dest: /etc/caddy/Caddyfile.d/cloudera_cde_{{ hostvars['localhost']['service_id'] }}.caddyfile
        mode: "0644"
      vars:
        cloudera_cde_external_domain: "{{ hostvars['localhost']['service_id'] }}"
        cloudera_cde_fqdn: "{{ groups['ecs_masters'] | map('extract', hostvars, 'ansible_host') | first }}"
        cloudera_cde_scheme: https
        cloudera_cde_port: 443
      notify: Reload Caddy

# Create wildcard cert for the CDE service
# NOTE: Use cloudera.exe.freeipa_server_unenrolled_tls role
- name: Create wildcard certificate for Cloudera CDE service
  hosts: freeipa
  gather_facts: true
  become: true
  tags:
    - freeipa
    - freeipa_server
  roles:
    - cloudera.exe.freeipa_server_unenrolled_tls
  vars:
    ipaadmin_password: "{{ freeipa_password | default(lookup('env', 'IPA_PASSWORD', default='Undefined')) }}"
    unenrolled_hostname: "{{ hostvars['localhost']['service_id'] }}"
    unenrolled_cert_profile: "wildcard" # Assumes a 'wildcard' profile exists

