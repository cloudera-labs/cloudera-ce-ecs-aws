- name: Ensure inventory readiness
  hosts: all
  gather_facts: false
  tags:
    - readiness
  tasks:
    - name: Check if host is ready
      ansible.builtin.wait_for_connection:
        timeout: 60

# NOTE: Requires internal version of cli to be installed due to missing namespace in CML workbench CLI call
# pip install --extra-index-url https://pypi.infra.cloudera.com/api/pypi/pypi-cloudera/simple --pre cdpcli-internal
- name: Set up Cloudera AI Workbench on ECS
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    ecs_env_name: ecs
  tasks:

    # - name: Assert that Control Plane is reachable
    #   block:
    #     - name: Confirm Control Plane Authentication
    #       cloudera.cloud.iam_user_info:
    #         current_user: true
    #         verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
    #   rescue:
    #     - name: Print error if Authentication is unsuccessful
    #       fail:
    #         msg: "Authentication to ECS control plane failed. Please check your credentials, and network connectivity to the control plane."

    - name: Create CML workspace - cloudera.cloud
      cloudera.cloud.ml:
        env: "{{ ecs_env_name }}"
        name: "{{ name_prefix }}-ml"
        governance: yes
        metrics: yes
        tls: yes # NOTE: In current cloudera.cloud, this is an alias with verify_tls. See https://github.com/cloudera-labs/cloudera.cloud/blob/main/plugins/module_utils/cdp_common.py#L106
        verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
        wait: yes
        namespace: "cml" # NOTE: Parameter not currently exposed in external CDP CLI/API/SDK. See https://cloudera.atlassian.net/browse/DSE-41725
        # TODO: Support for nfs server
        # nfs: 
        # nfs_version:
      register: __cai_workbench

    - name: Set workbench ID
      ansible.builtin.set_fact:
        workbench_id: "{{ __cai_workbench.workspace.instanceUrl | regex_replace('https://', '') | regex_replace('(\\..*$)', '') }}"

# Install Caddyfile for workbench wildcard
# NOTE: Play runs against proxy host
- name: Configure Caddy entry for Cloudera AI Workbench
  hosts: reverse_proxy
  gather_facts: true
  become: true
  tags:
    - reverse_proxy
    - proxy
    - cm_autotls
  vars:
    caddy_service: caddy
  handlers:
    - name: Reload Caddy
      ansible.builtin.service:
        name: "{{ caddy_service }}"
        state: reloaded
  tasks:
    # NOTE: Wildcard cert DOES NOT need to be fetched from FreeIPA first and used in Caddyfile
    - name: Install AI workbench reverse proxy
      when: groups['ecs_masters'] is defined and groups['ecs_masters'] | length > 0
      ansible.builtin.template:
        src: cloudera_cai_workbench.caddyfile.j2
        dest: /etc/caddy/Caddyfile.d/cloudera_cai_{{ hostvars['localhost']['workbench_id'] }}.caddyfile
        mode: "0644"
      vars:
        cloudera_workbench_external_domain: "{{ hostvars['localhost']['workbench_id'] }}.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
        cloudera_workbench_fqdn: "{{ groups['ecs_masters'] | map('extract', hostvars, 'ansible_host') | first }}"
        cloudera_workbench_scheme: https
        cloudera_workbench_port: 443
      notify: Reload Caddy

# Create wildcard cert for the CML workbench
- name: Create wildcard certificate for Cloudera AI workbench
  hosts: freeipa
  gather_facts: true
  become: true
  tags:
    - freeipa
    - freeipa_server
  roles:
    - cloudera.exe.freeipa_server_unenrolled_tls
  vars:
    ipaadmin_password: "{{ freeipa_password | default(lookup('env', 'IPA_PASSWORD', default='Undefined')) }}"
    unenrolled_hostname: "{{ hostvars['localhost']['workbench_id'] }}.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
    unenrolled_cert_profile: "wildcard" # Assumes a 'wildcard' profile exists

# Install wildcard cert for the CML workbench
- name: Create K8s secret for generated wildcard cert
  hosts: ecs_masters
  gather_facts: true
  become: true
  vars:
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    kubectl_path: /var/lib/rancher/rke2/bin/kubectl
  environment:
    PATH: "{{ kubectl_path | dirname }}:{{ ansible_env.PATH }}"
  tags:
    - k8s
  tasks:
    - name: Ensure kubectl binary is present
      ansible.builtin.stat:
        path: "{{ kubectl_path }}"
      register: kubectl_binary
      failed_when: kubectl_binary.stat.exists is not defined

    - name: Ensure the kubernetes Python package is installed
      ansible.builtin.pip:
        name: kubernetes
        state: present

    - name: Create TLS secret for Cloudera AI Workbench
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "cml"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cml-tls-secret
          data:
            tls.crt: "{{ lookup('file', crt_file) | b64encode }}"
            tls.key: "{{ lookup('file', key_file) | b64encode }}"
      vars:
        crt_file: "{{ hostvars['localhost']['workbench_id'] }}.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}.crt"
        key_file: "{{ hostvars['localhost']['workbench_id'] }}.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}.pem"
