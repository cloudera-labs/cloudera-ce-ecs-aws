- name: Ensure inventory readiness
  hosts: all
  gather_facts: false
  tags:
    - readiness
  tasks:
    - name: Check if host is ready
      ansible.builtin.wait_for_connection:
        timeout: 60

- name: Set up Cloudera Data Warehouse Service on ECS
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    ecs_env_name: ecs
  tasks:

    # - name: Assert that Control Plane is reachable
    #   block:
    #     - name: Confirm Control Plane Authentication
    #       cloudera.cloud.iam_user_info:
    #         current_user: true
    #         verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
    #   rescue:
    #     - name: Print error if Authentication is unsuccessful
    #       fail:
    #         msg: "Authentication to ECS control plane failed. Please check your credentials, and network connectivity to the control plane."

    - name: Fetch FreeIPA CA certificate
      ansible.builtin.uri:
        url: "https://freeipa.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/ipa/config/ca.crt"
        method: GET
        validate_certs: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
        return_content: true
      register: __freeipa_ca_cert_response
      delegate_to: localhost

    - name: Upload FreeIPA certificate to Control Plane LDAP provider
      ansible.builtin.command:
        cmd: >
          cdpcurl -X POST
          'https://console-cdp.apps.ecs.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/api/v1/iam/updateLdapProvider'
          -H 'content-type: application/json'
          -d '{{ ldap_provider_config | to_json }}'
          --insecure
      vars:
        ldap_provider_config:
          ldapProviderName: "cm-ldap"
          skipGroupSyncOnLogin: false
          url: "ldaps://{{ groups['freeipa'] | first }}"
          useAnonymousBind: "bind_dn_password"
          userSearchBase: "cn=users,cn=accounts,dc=cldr,dc=internal"
          userSearchFilter: "(uid={0})"
          usernameMappingAttribute: uid
          emailMappingAttribute: ""
          groupSearchBase: "cn=groups,cn=accounts,dc=cldr,dc=internal"
          groupSearchFilter: "(&(member={0})(objectClass=posixgroup)(! ( | (cn=admins) (cn=ipausers) ) ))"
          tlsCaCertificates:
            - "{{ __freeipa_ca_cert_response.content }}"
          bindDn: "uid=admin,cn=users,cn=accounts,dc=cldr,dc=internal"
          bindPassword: "{{ freeipa_password | default(lookup('env', 'IPA_PASSWORD', default='')) }}"
    
    - name: Create CDW cluster
      cloudera.cloud.dw_cluster:
        env: "{{ ecs_env_name }}"
        private_cloud:
          storage_class: "{{ dw.storage_class | default(omit) }}"
          db_client_certificate: "{{ lookup('file', dw.db_certificate) if (dw.db_certificate is defined) else omit }}"
          db_client_key: "{{ lookup('file', dw.db_private_key) if (dw.db_private_key is defined) else omit }}"
        verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}"
        state: present
        wait: true
      register: __cdw_cluster

    - name: Gather information about the database catalog
      cloudera.cloud.dw_database_catalog_info:
        # TODO: Use the name parameter to get default DBC
        # name: ...
        cluster_id: "{{ __cdw_cluster.cluster.id }}"
        verify_tls: "{{ not(caddy_self_signed is defined and caddy_self_signed) }}" # NOTE: See above
      register: __dw_dbc_info
      until: 
        - __dw_dbc_info.database_catalogs | length > 0
        - __dw_dbc_info.database_catalogs[0].status == 'Running'
      retries: 10
      delay: 30

